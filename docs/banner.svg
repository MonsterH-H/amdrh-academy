  <text x="141" y="102" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#2DD4BF" letter-spacing="2.5">E-LEARNING · FORMATION DES ARBITRES · PARTENAIRE FRMHB</text>
  <text x="140" y="132" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#A9BCD6">Cours, quiz, parcours, certificats à vérification QR, badges, messagerie et forum — temps réel inclus.</text>
  <text x="56" y="176" font-family="ui-monospace,monospace" font-size="10.5" fill="#5B7291" letter-spacing="2">FLUX CERTIFICATION</text>
