<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="ab-t">
  <title id="ab-t">Académie AMDRH — plateforme e-learning pour arbitres de handball — 72 routes API, 30 modèles Prisma, 40+ permissions, temps réel Socket.IO</title>
  <defs>
